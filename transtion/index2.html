<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body{
        background-color: black;
      }
      
      button{
        margin-top: 20%;
        margin-left: 45%;

        font-size: 16px;
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
        cursor: pointer;

        /* transition-property: all;
        transition-duration: 5s; */

        transition: all 0.5s;
      }

      button:hover{
        background-color: peru;
      }



    </style>

    <button>Hove Me Buddy</button>
