<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="counter">
    <h1 class="counter__title">Counter</h1>

    <output class="counter__value" id="count" aria-live="polite">0</output>

    <div class="counter__actions">
      <button class="btn btn--primary" id="decrement" type="button">Decrement</button>
      <button class="btn btn--primary" id="increment" type="button">Increment</button>
      <button class="btn btn--reset" id="reset" type="button">Reset</button>
    </div>
  </main>

  <script src="logic.js" defer></script>
</body>
</html>
