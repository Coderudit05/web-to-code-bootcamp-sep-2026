<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        background-color: black;
      }
      button {
        margin-top: 20%;
        margin-left: 45%;

        font-size: 16px;
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
        cursor: pointer;

        position: relative;

        overflow: hidden;

        background-color: transparent;
        color: white;
        border: 1px solid white;
      }

      button::before {
        content: "";
        height: 100%;
        width: 100%;
        background-color: brown;

        position: absolute;
        top: 0;
        left: 0;

        z-index: -1;

        transition-property: all;
        transition-duration: 0.5s;

        transform: translateX(-100%);
      }

      button:hover::before {

        transform: translateX(0%);
      }
    </style>
  </head>
  <body>
    <button>Hove Me Buddy</button>
  </body>
</html>
