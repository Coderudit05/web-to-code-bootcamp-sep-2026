<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }
      body {
        background: linear-gradient(
          to right,
          rgb(249, 168, 212),
          rgb(216, 180, 254),
          rgb(129, 140, 248)
        );

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        height: 200px;
        width: 300px;
        background-color: white;
        /* border: 1px solid black; */
        border-radius: 10px;

        box-shadow: 0px 0px 10px black;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .child {
        height: 40px;
        width: 40px;

        border-radius: 50%;

        animation-name: wave-anime;
        animation-duration: 1.2s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
        /* animation-delay: 5s; 
        we will not apply the animation delay here 
        because we want to apply this delay on each child element */
      }

      .child:nth-child(1) {
        background-color: purple;
        animation-delay: 0.1s;
      }
      .child:nth-child(2) {
        background-color: brown;
        animation-delay: 0.2s;
      }
      .child:nth-child(3) {
        background-color: pink;
        animation-delay: 0.3s;
      }
      .child:nth-child(4) {
        background-color: aquamarine;
        animation-delay: 0.4s;
      }
      .child:nth-child(5) {
        background-color: yellowgreen;
        animation-delay: 0.5s;
      }

      @keyframes wave-anime {
        0% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-50px);
        }

        100% {
          transform: translateY(0px);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
    </div>
  </body>
</html>
